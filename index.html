<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phim by Dung Nguyen</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0c13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
/* Bố cục: thanh menu dọc bên trái, vùng nội dung cuộn dọc, hàng poster cuộn ngang, điều hướng bằng phím mũi tên như remote TV */
:root{
  --bg:#0a0c13; --panel:#12151f; --panel2:#1a1e2b; --fg:#f2f4f8; --mute:#98a0b3;
  --accent:#ff3b30; --accent2:#ff7a45; --ring:#ffffff;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{font-size:clamp(10px,.8334vw,24px);height:100%}
body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;background:none;border:0}
.f{outline:none;cursor:pointer}
.f:focus-visible,.f:focus{outline:none}

/* Sidebar */
#side{position:fixed;left:0;top:0;bottom:0;width:7.5rem;z-index:20;display:flex;flex-direction:column;justify-content:center;gap:.6rem;padding:1rem .7rem;background:linear-gradient(90deg,#06070c 60%,rgba(6,7,12,0))}
#side:focus-within{width:13rem}
.logo{position:absolute;top:1.4rem;left:0;right:0;display:flex;justify-content:center}
.logo img{width:5.8rem;height:auto;display:block}
.nav{display:flex;align-items:center;gap:1rem;height:3.6rem;padding:0 1.2rem;border-radius:1.8rem;color:var(--mute);font-weight:600;font-size:1.1rem;white-space:nowrap;overflow:hidden;transition:background .15s,color .15s}
.nav svg{width:1.6rem;height:1.6rem;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav span{display:none}
#side:focus-within .nav span{display:inline}
.nav.on{color:var(--fg)}
.nav.on svg{color:var(--accent)}
.nav:focus{background:var(--fg);color:#10131c}
.nav:focus svg{color:var(--accent)}

/* Main */
#main{position:absolute;left:7.5rem;right:0;top:0;bottom:0;overflow-y:auto;overflow-x:hidden;padding-bottom:4rem}
#main::-webkit-scrollbar{display:none}
.hero{position:relative;height:46rem;display:flex;align-items:flex-end;padding:0 4rem 4rem 3rem;overflow:hidden}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 20%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 8%,rgba(10,12,19,.55) 48%,rgba(10,12,19,0) 80%),linear-gradient(0deg,var(--bg) 2%,rgba(10,12,19,0) 45%)}
.hero .info{position:relative;z-index:2;max-width:46rem}
.tags{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}
.tag{padding:.25rem .8rem;border-radius:.4rem;background:rgba(255,255,255,.14);font-size:.95rem;font-weight:600}
.tag.hot{background:var(--accent)}
.hero h1{font-size:3.4rem;line-height:1.1;font-weight:800;text-wrap:balance}
.hero .sub{margin-top:.6rem;color:var(--mute);font-size:1.2rem}
.btns{display:flex;gap:1rem;margin-top:1.6rem}
.btn{display:inline-flex;align-items:center;gap:.7rem;height:3.6rem;padding:0 2rem;border-radius:1.8rem;background:rgba(255,255,255,.16);font-weight:700;font-size:1.15rem;transition:transform .15s,background .15s}
.btn svg{width:1.4rem;height:1.4rem}
.btn.pri{background:var(--accent)}
.btn:focus{background:var(--fg);color:#10131c;transform:scale(1.06)}
.btn:focus svg{fill:var(--accent)}
.dots{position:absolute;right:3rem;bottom:3rem;display:flex;gap:.5rem;z-index:2}
.dots i{width:.6rem;height:.6rem;border-radius:1rem;background:rgba(255,255,255,.35);transition:.3s}
.dots i.on{width:2rem;background:var(--accent)}

.row{padding:0 0 .6rem 3rem}
.row h2{font-size:1.6rem;font-weight:700;margin:1.2rem 0 .3rem}
.track{display:flex;gap:1.3rem;overflow-x:auto;padding:1.3rem 3rem 1.6rem 0;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:none;width:14rem;position:relative;border-radius:.9rem;transition:transform .12s}
.card .pic{aspect-ratio:2/3;border-radius:.9rem;background:var(--panel2) center/cover no-repeat;overflow:hidden;position:relative}
.card .badge{position:absolute;left:.5rem;top:.5rem;padding:.15rem .5rem;border-radius:.3rem;background:var(--accent);font-size:.8rem;font-weight:700}
.card .ep{position:absolute;right:0;bottom:0;left:0;padding:1.4rem .6rem .5rem;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);font-size:.85rem;font-weight:600}
.card .t{margin-top:.6rem;font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .o{font-size:.85rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card:focus{transform:scale(1.08);z-index:5}
.card:focus .pic{box-shadow:0 0 0 .28rem var(--ring)}
.card .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* Trang danh sách */
.page{padding:3rem 3rem 2rem}
.page h1{font-size:2.4rem;font-weight:800;margin-bottom:1.2rem}
.chips{display:flex;flex-wrap:wrap;gap:.7rem;margin-bottom:1.6rem}
.chip{padding:.55rem 1.3rem;border-radius:2rem;background:var(--panel2);font-weight:600;font-size:1.05rem;transition:.15s}
.chip.on{background:var(--accent)}
.chip:focus{background:var(--fg);color:#10131c;transform:scale(1.07)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:2.2rem 1.5rem;padding:1rem .5rem}
.more{display:flex;justify-content:center;padding:1.5rem}
.searchbox{display:flex;align-items:center;gap:1rem;height:4rem;padding:0 1.6rem;border-radius:2rem;background:var(--panel2);max-width:46rem;margin-bottom:1.6rem}
.searchbox input{flex:1;outline:none;font-size:1.3rem}
.searchbox:focus-within{box-shadow:0 0 0 .22rem var(--ring)}
.msg{padding:4rem 1rem;color:var(--mute);font-size:1.2rem;text-align:center}
.skel .pic{animation:pulse 1.2s infinite alternate}
@keyframes pulse{to{opacity:.45}}

/* Layer: chi tiết + trình phát */
.layer{position:fixed;inset:0;z-index:50;display:none}
.layer.open{display:block}
#detail{background:var(--bg);overflow-y:auto;scrollbar-width:none}
#detail::-webkit-scrollbar{display:none}
.d-bg{position:absolute;inset:0 0 auto 0;height:100%;background-size:cover;background-position:center top;opacity:.35}
.d-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 25%,rgba(10,12,19,.6)),linear-gradient(90deg,var(--bg),transparent 70%)}
.d-body{position:relative;display:flex;gap:3rem;padding:4rem 5rem 2rem}
.d-poster{flex:none;width:19rem;aspect-ratio:2/3;border-radius:1rem;background:var(--panel2) center/cover;box-shadow:0 1.5rem 3rem rgba(0,0,0,.6)}
.d-info{min-width:0;flex:1}
.d-info h1{font-size:3rem;font-weight:800;line-height:1.1}
.d-info .sub{color:var(--mute);font-size:1.2rem;margin:.5rem 0 1rem}
.d-info p.desc{margin-top:1.2rem;color:#c9cfdd;line-height:1.65;font-size:1.1rem;max-width:62rem;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.facts{display:grid;grid-template-columns:auto 1fr;gap:.35rem 1.2rem;margin-top:1.2rem;font-size:1rem;max-width:62rem}
.facts dt{color:var(--mute)}
.d-eps{position:relative;padding:1rem 5rem 4rem}
.d-eps h3{font-size:1.4rem;margin:1.2rem 0 .8rem}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.4rem,1fr));gap:.8rem}
.ep-b{height:3.4rem;border-radius:.7rem;background:var(--panel2);font-weight:600;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:.15s;padding:0 .4rem;white-space:nowrap;overflow:hidden}
.ep-b:focus{background:var(--fg);color:#10131c;transform:scale(1.08)}
.ep-b.cur{outline:2px solid var(--accent)}

#player{background:#000;z-index:60;overflow:hidden}
#player video,#player iframe{position:absolute;inset:0;width:100%;height:100%;background:#000;border:0;object-fit:contain;transition:none}
#pwrap{position:absolute;inset:0;outline:none}
.ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;opacity:1;transition:opacity .3s;pointer-events:none}
.ui.hide{opacity:0}
.ui.hide *{pointer-events:none!important}
.top,.bot{pointer-events:auto;padding:2rem 3rem}
.top{background:linear-gradient(180deg,rgba(0,0,0,.8),transparent);display:flex;align-items:center;gap:1.4rem;padding-bottom:4rem}
.top h2{font-size:1.5rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{color:var(--mute);font-size:1.05rem;display:block;font-weight:500}
.bot{background:linear-gradient(0deg,rgba(0,0,0,.88),transparent);padding-top:5rem}
.seekrow{display:flex;align-items:center;gap:1.2rem;font-size:1.05rem;font-variant-numeric:tabular-nums;font-weight:600}
.seek{position:relative;flex:1;height:.55rem;border-radius:1rem;background:rgba(255,255,255,.25);cursor:pointer;transition:height .15s}
.seek:focus,.seek:hover{height:.85rem}
.seek .buf,.seek .cur{position:absolute;left:0;top:0;bottom:0;border-radius:1rem}
.seek .buf{background:rgba(255,255,255,.3)}
.seek .cur{background:var(--accent)}
.seek .knob{position:absolute;top:50%;width:1.4rem;height:1.4rem;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 .2rem rgba(0,0,0,.35)}
.seek:focus .knob{box-shadow:0 0 0 .3rem var(--accent)}
.ctrls{display:flex;align-items:center;justify-content:center;gap:1.1rem;margin-top:1.2rem;position:relative}
.cb{width:4rem;height:4rem;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);transition:.15s;position:relative}
.cb svg{width:1.8rem;height:1.8rem;fill:currentColor}
.cb.big{width:5.2rem;height:5.2rem}
.cb.big svg{width:2.4rem;height:2.4rem}
.cb:focus,.cb:hover{background:#fff;color:#10131c;transform:scale(1.12)}
.cb .n{position:absolute;font-size:.72rem;font-weight:800;top:50%;left:50%;transform:translate(-50%,-38%)}
.cb.txt{width:auto;padding:0 1.4rem;border-radius:2rem;font-weight:700;font-size:1rem;gap:.5rem}
.side-r{position:absolute;right:0;display:flex;gap:1rem}
.side-l{position:absolute;left:0;display:flex;gap:1rem}
#toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);padding:.7rem 1.6rem;border-radius:2rem;background:rgba(20,22,30,.9);font-weight:700;font-size:1.3rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:5}
#toast.show{opacity:1}
#spin{position:absolute;left:50%;top:50%;width:5rem;height:5rem;margin:-2.5rem;border-radius:50%;border:.4rem solid rgba(255,255,255,.2);border-top-color:var(--accent);animation:sp .8s linear infinite;display:none;z-index:4}
#spin.on{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
/* Cá nhân */
.av{display:inline-flex;align-items:center;justify-content:center;width:2.2rem;height:2.2rem;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;font-size:1.1rem;flex:none;font-style:normal}
.av.guest{background:var(--panel2);color:var(--mute)}
.av.big{width:9rem;height:9rem;font-size:3.6rem}
.nav:focus .av{box-shadow:0 0 0 .18rem var(--accent)}
.me{display:flex;gap:3rem;padding:3rem}
.me-side{flex:none;width:23rem;display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:2.2rem 1.6rem;border-radius:1.4rem;background:var(--panel);align-self:flex-start}
.me-name{font-size:1.6rem;font-weight:800;margin-top:.6rem}
.me-sub{color:var(--mute);font-size:1rem;margin-bottom:.8rem}
.me-auth{display:flex;flex-direction:column;gap:.7rem;width:100%}
.me-auth .btn{justify-content:center;padding:0 1rem}
.me-menu{display:flex;flex-direction:column;gap:.4rem;width:100%;margin-top:1.4rem;border-top:1px solid rgba(255,255,255,.08);padding-top:1.2rem}
.mi{height:3.4rem;border-radius:1.7rem;padding:0 1.4rem;text-align:left;font-weight:600;font-size:1.1rem;color:var(--mute);transition:.15s}
.mi.on{color:var(--fg);background:var(--panel2)}
.mi:focus{background:var(--fg);color:#10131c;transform:scale(1.04)}
.me-body{flex:1;min-width:0}
.me-body h1{font-size:2.2rem;font-weight:800;margin-bottom:1.2rem}
.auth{display:flex;flex-direction:column;gap:1rem;max-width:34rem}
.auth label{display:flex;flex-direction:column;gap:.45rem;color:var(--mute);font-size:1rem;font-weight:600}
.auth input{height:3.8rem;padding:0 1.4rem;border-radius:1.9rem;background:var(--panel2);color:var(--fg);outline:none;font-size:1.2rem}
.auth input:focus{box-shadow:0 0 0 .22rem var(--ring)}
.err{color:#ff8a80;min-height:1.4rem;font-size:1rem}
.note{color:var(--mute);line-height:1.6;font-size:1.1rem;max-width:52rem;margin-bottom:1.4rem}
.stats{display:flex;gap:1.2rem;margin-bottom:1.6rem;flex-wrap:wrap}
.stat{padding:1.1rem 1.8rem;border-radius:1rem;background:var(--panel);min-width:10rem}
.stat b{display:block;font-size:2rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--mute);font-size:.95rem}
.me-body .btn{margin-bottom:1rem}

/* Truyền hình */
.chip em{font-style:normal;opacity:.6;font-size:.85em;margin-left:.3rem;font-variant-numeric:tabular-nums}
.srcpanel{background:var(--panel);border-radius:1.2rem;padding:1.5rem 1.8rem;margin-bottom:1.8rem;max-width:64rem}
.srcpanel h2{font-size:1.4rem;margin-bottom:.4rem}
.srcpanel h3{font-size:1.1rem;margin:1.4rem 0 .6rem;color:var(--mute)}
.srow{display:flex;align-items:center;gap:1rem;padding:.8rem 0;border-bottom:1px solid rgba(255,255,255,.07)}
.srow .si{flex:1;min-width:0}
.srow b{display:block;font-size:1.05rem}
.srow small{display:block;color:var(--mute);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sst{color:var(--mute);font-size:.9rem;white-space:nowrap}
.sst.bad{color:#ff8a80}
.sbtn{height:2.8rem;padding:0 1.2rem;border-radius:1.4rem;background:var(--panel2);font-weight:600;font-size:.95rem;transition:.15s}
.sbtn.danger{color:#ff8a80}
.sbtn:focus{background:var(--fg);color:#10131c;transform:scale(1.06)}
.addf{display:flex;flex-direction:column;gap:.8rem;max-width:44rem}
.fld{height:3.4rem;padding:0 1.3rem;border-radius:1.7rem;background:var(--panel2);color:var(--fg);outline:none;font-size:1.05rem;border:0}
.fld:focus{box-shadow:0 0 0 .22rem var(--ring)}
select.fld{appearance:none;-webkit-appearance:none}

.tv-top{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin-bottom:1.4rem}
.tv-src{display:flex;flex-direction:column;gap:.8rem;max-width:46rem;margin-bottom:1.4rem}
.tv-src input{height:3.6rem;padding:0 1.4rem;border-radius:1.8rem;background:var(--panel2);color:var(--fg);outline:none;font-size:1.1rem}
.tv-src input:focus{box-shadow:0 0 0 .22rem var(--ring)}
.tvgrid{grid-template-columns:repeat(auto-fill,minmax(16rem,1fr))}
.chc{display:block;text-align:left;border-radius:.9rem;transition:transform .12s;position:relative}
.chl{position:relative;aspect-ratio:16/10;border-radius:.9rem;background:var(--panel2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.chl img{position:relative;z-index:1;max-width:72%;max-height:72%;object-fit:contain}
.chn{position:absolute;font-weight:800;font-size:2.4rem;color:rgba(255,255,255,.16)}
.live-b{position:absolute;z-index:2;left:.5rem;top:.5rem;padding:.12rem .5rem;border-radius:.3rem;background:var(--accent);font-size:.75rem;font-weight:800;font-style:normal;letter-spacing:.03em}
.chc .t{margin-top:.6rem;font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chc .o{font-size:.85rem;color:var(--mute)}
.chc:focus{transform:scale(1.07);z-index:5}
.chc:focus .chl{box-shadow:0 0 0 .28rem var(--ring)}
.islive .seekrow,.islive #bBack10,.islive #bFwd10{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<nav id="side" aria-label="Menu">
  <div class="logo"><img src="logo.png" alt="Phim by Dung Nguyen"></div>
  <button class="nav f" data-go="me"><b class="av guest" id="navAv">K</b><span>Cá nhân</span></button>
  <button class="nav f" data-go="tv"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 2l4 4 4-4M9 22h6"/></svg><span>Truyền hình</span></button>
  <button class="nav f" data-go="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Tìm kiếm</span></button>
  <button class="nav f on" data-go="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Trang chủ</span></button>
  <button class="nav f" data-go="phim-le"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5l5 2.5-5 2.5z"/></svg><span>Phim lẻ</span></button>
  <button class="nav f" data-go="phim-bo"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="14" height="12" rx="2"/><path d="M7 4h14v12"/></svg><span>Phim bộ</span></button>
  <button class="nav f" data-go="the-loai"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Thể loại</span></button>
  <button class="nav f" data-go="hoat-hinh"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14c1 2 7 2 8 0M9 9.5h.01M15 9.5h.01"/></svg><span>Hoạt hình</span></button>
</nav>

<main id="main"></main>

<section id="detail" class="layer" aria-label="Chi tiết phim"></section>

<section id="player" class="layer" aria-label="Trình phát">
  <div id="pwrap" tabindex="-1">
    <video id="vid" playsinline></video>
    <div id="spin"></div>
    <div id="toast"></div>
    <div class="ui" id="ui">
      <div class="top">
        <button class="cb f" id="bBack" aria-label="Quay lại"><svg viewBox="0 0 24 24"><path d="M15.5 4L7 12l8.5 8 1.5-1.6L10.2 12l6.8-6.4z"/></svg></button>
        <div style="min-width:0"><h2 id="pTitle"></h2><small id="pSub"></small></div>
      </div>
      <div class="bot">
        <div class="seekrow">
          <span id="tCur">0:00</span>
          <div class="seek f" id="seek" role="slider" aria-label="Thanh tua" tabindex="0"><div class="buf" id="sBuf"></div><div class="cur" id="sCur"></div><div class="knob" id="sKnob"></div></div>
          <span id="tDur">0:00</span>
        </div>
        <div class="ctrls">
          <div class="side-l">
            <button class="cb txt f" id="bPrev" aria-label="Tập trước"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg><span id="pvT">Tập trước</span></button>
          </div>
          <button class="cb f" id="bBack10" aria-label="Lùi 10 giây"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg><span class="n">10</span></button>
          <button class="cb big f" id="bPlay" aria-label="Phát / Tạm dừng"></button>
          <button class="cb f" id="bFwd10" aria-label="Tiến 10 giây"><svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></svg><span class="n">10</span></button>
          <div class="side-r">
            <button class="cb txt f" id="bNext" aria-label="Tập sau"><span id="nxT">Tập sau</span><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg></button>
            <button class="cb txt f" id="bZoom" aria-label="Toàn màn hình"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg><span id="zLbl">Toàn màn hình</span></button>
            <button class="cb f" id="bPip" aria-label="Hình trong hình"><svg viewBox="0 0 24 24"><path d="M19 11h-8v6h8zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18z"/></svg></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
(() => {
'use strict';
const API = 'https://phimapi.com';
const CDN = 'https://phimimg.com';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const main = $('#main'), detail = $('#detail'), player = $('#player');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- API ---------- */
const cache = new Map();
async function api(path) {
  if (cache.has(path)) return cache.get(path);
  const r = await fetch(API + path);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  cache.set(path, d);
  return d;
}
const img = p => {
  if (!p) return '';
  if (/^https?:/.test(p)) return p;
  p = p.replace(/^\/+/, '');
  return CDN + '/' + (p.startsWith('upload/') ? p : 'upload/vod/' + p);
};
const itemsOf = d => (d.data && d.data.items) || d.items || [];
const list = async (kind, page = 1, limit = 24) => itemsOf(await api(`/v1/api/danh-sach/${kind}?page=${page}&limit=${limit}&sort_field=modified.time&sort_type=desc`));
const latest = async (page = 1) => itemsOf(await api(`/danh-sach/phim-moi-cap-nhat?page=${page}`));
const byGenre = async (slug, page = 1) => itemsOf(await api(`/v1/api/the-loai/${slug}?page=${page}&limit=24`));
const search = async q => itemsOf(await api(`/v1/api/tim-kiem?keyword=${encodeURIComponent(q)}&limit=24`));

/* ---------- Thẻ phim ---------- */
function card(m) {
  const b = document.createElement('button');
  b.className = 'card f';
  b.dataset.slug = m.slug;
  const poster = img(m.thumb_url || m.poster_url);
  b.innerHTML = `<div class="pic"><img src="${esc(poster)}" loading="lazy" decoding="async" alt="" onerror="this.remove()">
      ${m.quality ? `<span class="badge">${esc(m.quality)}</span>` : ''}
      ${m.episode_current ? `<div class="ep">${esc(m.episode_current)}</div>` : ''}
    </div>
    <div class="t">${esc(m.name)}</div><div class="o">${esc(m.origin_name || '')}${m.year ? ' · ' + m.year : ''}</div>`;
  b.onclick = () => openDetail(m.slug);
  return b;
}
function row(title, items) {
  const s = document.createElement('section');
  s.className = 'row';
  s.innerHTML = `<h2>${esc(title)}</h2><div class="track"></div>`;
  const t = $('.track', s);
  items.forEach(m => t.append(card(m)));
  return s;
}
const skeletonRow = title => {
  const s = document.createElement('section');
  s.className = 'row';
  s.innerHTML = `<h2>${esc(title)}</h2><div class="track">${'<div class="card skel"><div class="pic"></div></div>'.repeat(9)}</div>`;
  return s;
};
const errorBox = (retry) => {
  const d = document.createElement('div');
  d.className = 'msg';
  d.innerHTML = 'Không tải được dữ liệu. Kiểm tra kết nối mạng rồi thử lại.<div class="btns" style="justify-content:center"><button class="btn pri f">Thử lại</button></div>';
  $('button', d).onclick = retry;
  return d;
};

/* ---------- Điều hướng trang ---------- */
let current = 'home', heroTimer = null, token = 0;
function setNav(k) {
  current = k;
  $$('.nav').forEach(n => n.classList.toggle('on', n.dataset.go === k));
}
async function go(k, arg) {
  clearInterval(heroTimer);
  const my = ++token;
  setNav(k);
  main.scrollTop = 0;
  main.innerHTML = '';
  if (k === 'home') return home(my);
  if (k === 'phim-le') return gridPage('Phim lẻ', p => list('phim-le', p), my);
  if (k === 'phim-bo') return gridPage('Phim bộ', p => list('phim-bo', p), my);
  if (k === 'hoat-hinh') return gridPage('Hoạt hình', p => list('hoat-hinh', p), my);
  if (k === 'the-loai') return genrePage(arg, my);
  if (k === 'search') return searchPage(my);
  if (k === 'me') return profilePage(arg, my);
  if (k === 'tv') return tvPage(my, arg);
}

/* ---------- Tài khoản, yêu thích, xem sau, sao lưu (lưu trên thiết bị) ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let user = LS.get('kkp:session', null);
const accounts = () => { const a = LS.get('kkp:accounts', {}); return a && typeof a === 'object' ? a : {}; };
if (user && !accounts()[user]) user = null;
const ukey = n => 'kkp:u:' + (user || '_guest') + ':' + n;
const getList = n => { const v = LS.get(ukey(n), []); return Array.isArray(v) ? v : []; };
const setList = (n, v) => LS.set(ukey(n), v);
const getFav = () => getList('fav');
const getHist = () => getList('hist');
const getLater = () => getList('later');
const getPos = () => { const v = LS.get(ukey('pos'), {}); return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; };
const summary = m => ({ slug: m.slug, name: m.name, origin_name: m.origin_name, thumb_url: m.thumb_url, poster_url: m.poster_url, year: m.year, quality: m.quality, episode_current: m.episode_current });
const inList = (n, slug) => getList(n).some(m => m.slug === slug);
const isFav = slug => inList('fav', slug);
const isLater = slug => inList('later', slug);
function toggleList(n, m) {
  let l = getList(n);
  if (l.some(x => x.slug === m.slug)) l = l.filter(x => x.slug !== m.slug);
  else l.unshift(summary(m));
  setList(n, l);
  return inList(n, m.slug);
}
const toggleFav = m => toggleList('fav', m);
const toggleLater = m => toggleList('later', m);
function pushHist(m, extra) {
  const h = getHist().filter(x => x.slug !== m.slug);
  h.unshift({ ...summary(m), ...extra });
  setList('hist', h.slice(0, 60));
}

async function hashPw(pw, salt) {
  const data = salt + ':' + pw;
  try {
    if (window.crypto && crypto.subtle) {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
      return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  let h = 5381;
  for (let i = 0; i < data.length; i++) h = ((h << 5) + h + data.charCodeAt(i)) | 0;
  return 'x' + (h >>> 0).toString(16);
}
const randSalt = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), x => x.toString(16).padStart(2, '0')).join('');
function refreshAvatar() {
  const a = $('#navAv');
  if (!a) return;
  a.textContent = (user || 'K')[0].toUpperCase();
  a.classList.toggle('guest', !user);
}
async function register(name, pw, pw2) {
  name = name.trim().toLowerCase();
  if (!/^[a-z0-9_.]{3,20}$/.test(name)) return 'Tên đăng nhập dài 3 đến 20 ký tự, gồm chữ không dấu, số, dấu _ hoặc dấu chấm.';
  if (pw.length < 6) return 'Mật khẩu cần ít nhất 6 ký tự.';
  if (pw !== pw2) return 'Hai mật khẩu chưa giống nhau.';
  const acc = accounts();
  if (acc[name]) return 'Tên đăng nhập này đã có trên thiết bị. Hãy chọn tên khác hoặc đăng nhập.';
  const salt = randSalt();
  acc[name] = { salt, hash: await hashPw(pw, salt), created: Date.now() };
  LS.set('kkp:accounts', acc);
  const guest = { fav: getFav(), later: getLater(), hist: getHist(), pos: getPos() };
  user = name;
  LS.set('kkp:session', name);
  ['fav', 'later', 'hist'].forEach(k => setList(k, guest[k]));
  LS.set(ukey('pos'), guest.pos);
  refreshAvatar();
  return null;
}
async function login(name, pw) {
  name = name.trim().toLowerCase();
  const a = accounts()[name];
  if (!a || (await hashPw(pw, a.salt)) !== a.hash) return 'Sai tên đăng nhập hoặc mật khẩu.';
  user = name;
  LS.set('kkp:session', name);
  refreshAvatar();
  return null;
}
function logout() {
  user = null;
  LS.set('kkp:session', null);
  refreshAvatar();
}

function exportData() {
  const data = { app: 'kkphim-tv', version: 1, user: user || null, exported: new Date().toISOString(), fav: getFav(), later: getLater(), hist: getHist(), pos: getPos() };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'kkphim-sao-luu-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function importData(text) {
  let d;
  try { d = JSON.parse(text); } catch (e) { return null; }
  if (!d || d.app !== 'kkphim-tv') return null;
  const out = {};
  ['fav', 'later', 'hist'].forEach(n => {
    const cur = getList(n);
    const seen = new Set(cur.map(x => x.slug));
    const add = (Array.isArray(d[n]) ? d[n] : []).filter(x => x && typeof x.slug === 'string' && !seen.has(x.slug));
    setList(n, cur.concat(add).slice(0, 200));
    out[n] = add.length;
  });
  if (d.pos && typeof d.pos === 'object' && !Array.isArray(d.pos)) LS.set(ukey('pos'), { ...d.pos, ...getPos() });
  return out;
}

/* ---------- Trang Cá nhân ---------- */
let meTab = 'fav';
function profilePage(tab, my) {
  tab = tab || 'fav';
  meTab = tab;
  const tabs = [['fav', 'Phim yêu thích'], ['later', 'Xem sau'], ['hist', 'Lịch sử xem'], ['backup', 'Sao lưu và khôi phục']];
  const wrap = document.createElement('div');
  wrap.className = 'me';
  wrap.innerHTML = `<aside class="me-side">
      <div class="av big${user ? '' : ' guest'}">${esc((user || 'K')[0].toUpperCase())}</div>
      <div class="me-name">${esc(user || 'Khách')}</div>
      <div class="me-sub">${user ? 'Đã đăng nhập' : 'Chưa đăng nhập'}</div>
      <div class="me-auth">${user
        ? '<button class="btn f" data-tab="logout">Đăng xuất</button>'
        : '<button class="btn pri f" data-tab="login">Đăng nhập</button><button class="btn f" data-tab="register">Đăng ký</button>'}</div>
      <div class="me-menu">${tabs.map(([k, t]) => `<button class="mi f${k === tab ? ' on' : ''}" data-tab="${k}">${t}</button>`).join('')}</div>
    </aside><section class="me-body" id="meBody"></section>`;
  main.append(wrap);
  $$('[data-tab]', wrap).forEach(b => b.onclick = () => {
    if (b.dataset.tab === 'logout') { logout(); go('me', 'fav'); }
    else go('me', b.dataset.tab);
  });
  const body = $('#meBody', wrap);
  if (tab === 'fav') listBody(body, 'fav', 'Phim yêu thích', 'Chưa có phim nào. Mở một phim rồi chọn "Thêm yêu thích".');
  else if (tab === 'later') listBody(body, 'later', 'Xem sau', 'Chưa có phim nào. Mở một phim rồi chọn "Xem sau".');
  else if (tab === 'hist') listBody(body, 'hist', 'Lịch sử xem', 'Bạn chưa xem phim nào.');
  else if (tab === 'backup') backupBody(body);
  else authBody(body, tab);
  const first = tab === 'login' || tab === 'register' ? $('#au', wrap) : $('.mi.on', wrap);
  first && first.focus({ preventScroll: true });
}
function listBody(body, name, title, empty) {
  const items = getList(name);
  body.innerHTML = `<h1>${esc(title)}</h1>`;
  if (!items.length) { body.insertAdjacentHTML('beforeend', `<div class="msg" style="text-align:left;padding-left:0">${esc(empty)}</div>`); return; }
  const clr = document.createElement('button');
  clr.className = 'btn f'; clr.textContent = 'Xóa tất cả';
  let armed = false;
  clr.onclick = () => {
    if (!armed) { armed = true; clr.textContent = 'Bấm lần nữa để xóa tất cả'; return; }
    setList(name, []); go('me', name);
  };
  const g = document.createElement('div');
  g.className = 'grid';
  items.forEach(m => g.append(card(m)));
  body.append(clr, g);
}
function authBody(body, mode) {
  const reg = mode === 'register';
  body.innerHTML = `<h1>${reg ? 'Đăng ký tài khoản' : 'Đăng nhập'}</h1>
    <p class="note">Tài khoản được lưu trên thiết bị này. ${reg ? 'Phim yêu thích, xem sau và lịch sử hiện có sẽ được chuyển vào tài khoản mới.' : ''}</p>
    <form class="auth" id="af">
      <label>Tên đăng nhập<input id="au" class="f" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label>Mật khẩu<input id="ap" class="f" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}"></label>
      ${reg ? '<label>Nhập lại mật khẩu<input id="ap2" class="f" type="password" autocomplete="new-password"></label>' : ''}
      <div class="err" id="ae" role="alert"></div>
      <button class="btn pri f" type="submit" id="as" style="justify-content:center">${reg ? 'Tạo tài khoản' : 'Đăng nhập'}</button>
      <button class="btn f" type="button" id="aw" style="justify-content:center">${reg ? 'Đã có tài khoản? Đăng nhập' : 'Chưa có tài khoản? Đăng ký'}</button>
    </form>`;
  $('#aw', body).onclick = () => go('me', reg ? 'login' : 'register');
  $('#af', body).onsubmit = async e => {
    e.preventDefault();
    const err = $('#ae', body), btn = $('#as', body);
    err.textContent = '';
    btn.disabled = true;
    const r = reg ? await register($('#au', body).value, $('#ap', body).value, $('#ap2', body).value) : await login($('#au', body).value, $('#ap', body).value);
    btn.disabled = false;
    if (r) { err.textContent = r; return; }
    go('me', 'fav');
  };
}
function backupBody(body) {
  body.innerHTML = `<h1>Sao lưu và khôi phục</h1>
    <p class="note">Dữ liệu nằm ngay trên thiết bị này, chưa có máy chủ. Muốn chuyển sang thiết bị khác, tải file sao lưu rồi khôi phục ở máy mới. File không chứa mật khẩu.</p>
    <div class="stats">
      <div class="stat"><b>${getFav().length}</b><span>Yêu thích</span></div>
      <div class="stat"><b>${getLater().length}</b><span>Xem sau</span></div>
      <div class="stat"><b>${getHist().length}</b><span>Lịch sử xem</span></div>
    </div>
    <div class="btns" style="margin-top:0"><button class="btn pri f" id="bx">Tải file sao lưu</button><button class="btn f" id="bi">Khôi phục từ file</button></div>
    <input type="file" id="bf" accept="application/json,.json" hidden>
    <div class="note" id="bm" style="margin-top:1.4rem" role="status"></div>`;
  $('#bx', body).onclick = () => { exportData(); $('#bm', body).textContent = 'Đã tạo file sao lưu. Kiểm tra thư mục Tải xuống của trình duyệt.'; };
  const inp = $('#bf', body);
  $('#bi', body).onclick = () => inp.click();
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const r = importData(await f.text());
    const m = $('#bm', body);
    if (!r) { m.textContent = 'File không đúng định dạng sao lưu của KKPhim TV.'; return; }
    m.textContent = `Đã khôi phục: thêm ${r.fav} phim yêu thích, ${r.later} phim xem sau, ${r.hist} mục lịch sử.`;
    $$('.stat b', body).forEach((b, i) => b.textContent = [getFav, getLater, getHist][i]().length);
  };
}

async function home(my) {
  const hero = document.createElement('div');
  hero.className = 'hero';
  hero.innerHTML = '<div class="bg"></div>';
  main.append(hero);
  const hs = getHist();
  if (hs.length) main.append(row('Tiếp tục xem', hs.slice(0, 18)));
  const defs = [['Phim mới cập nhật', () => latest(1)], ['Phim lẻ', () => list('phim-le', 1, 18)], ['Phim bộ', () => list('phim-bo', 1, 18)], ['Hoạt hình', () => list('hoat-hinh', 1, 18)], ['TV Shows', () => list('tv-shows', 1, 18)]];
  const holders = defs.map(([t]) => { const s = skeletonRow(t); main.append(s); return s; });
  let heroItems = [], failed = 0;
  await Promise.all(defs.map(async ([t, fn], i) => {
    try {
      const items = await fn();
      if (my !== token) return;
      if (i === 0) heroItems = items.filter(m => m.poster_url || m.thumb_url).slice(0, 6);
      const r = row(t, items);
      holders[i].replaceWith(r);
    } catch (e) { failed++; holders[i].remove(); }
  }));
  if (my !== token) return;
  if (failed === defs.length) { main.append(errorBox(() => go('home'))); hero.remove(); return; }
  buildHero(hero, heroItems);
  focusFirst(main);
}
function buildHero(el, items) {
  if (!items.length) { el.remove(); return; }
  let i = 0;
  const bg = $('.bg', el);
  const info = document.createElement('div');
  info.className = 'info';
  const dots = document.createElement('div');
  dots.className = 'dots';
  el.append(info, dots);
  const show = n => {
    i = (n + items.length) % items.length;
    const m = items[i];
    bg.style.backgroundImage = `url('${esc(img(m.poster_url || m.thumb_url))}')`;
    info.innerHTML = `<div class="tags"><span class="tag hot">Mới cập nhật</span>${m.quality ? `<span class="tag">${esc(m.quality)}</span>` : ''}${m.year ? `<span class="tag">${m.year}</span>` : ''}${m.episode_current ? `<span class="tag">${esc(m.episode_current)}</span>` : ''}</div>
      <h1>${esc(m.name)}</h1><div class="sub">${esc(m.origin_name || '')}</div>
      <div class="btns"><button class="btn pri f"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>Xem ngay</button></div>`;
    $('.btn', info).onclick = () => openDetail(m.slug);
    dots.innerHTML = items.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('');
  };
  show(0);
  heroTimer = setInterval(() => { if (!document.activeElement.closest('.hero')) show(i + 1); }, 15000);
}

async function gridPage(title, fetcher, my, extraTop) {
  const wrap = document.createElement('div');
  wrap.className = 'page';
  wrap.innerHTML = `<h1>${esc(title)}</h1>`;
  if (extraTop) wrap.append(extraTop);
  const grid = document.createElement('div');
  grid.className = 'grid';
  const more = document.createElement('div');
  more.className = 'more';
  wrap.append(grid, more);
  main.append(wrap);
  let page = 1, busy = false, done = false;
  const load = async () => {
    if (busy || done) return;
    busy = true;
    try {
      const items = await fetcher(page);
      if (my !== token) return;
      items.forEach(m => grid.append(card(m)));
      if (items.length < 12) done = true;
      page++;
      if (!grid.children.length) grid.outerHTML = '<div class="msg">Không có phim phù hợp.</div>';
    } catch (e) {
      if (my !== token) return;
      more.innerHTML = '';
      more.append(errorBox(() => { more.innerHTML = ''; busy = false; load(); }));
    }
    busy = false;
    more.innerHTML = '';
    if (!done && grid.children.length) {
      const b = document.createElement('button');
      b.className = 'btn f'; b.textContent = 'Xem thêm';
      b.onclick = async () => { b.remove(); await load(); const c = grid.children[grid.children.length - 12]; c && c.focus(); };
      more.append(b);
    }
    if (page === 2 && !extraTop) focusFirst(grid);
  };
  await load();
}

const FALLBACK_GENRES = [['hanh-dong','Hành Động'],['tinh-cam','Tình Cảm'],['hai-huoc','Hài Hước'],['co-trang','Cổ Trang'],['tam-ly','Tâm Lý'],['hinh-su','Hình Sự'],['chien-tranh','Chiến Tranh'],['the-thao','Thể Thao'],['vo-thuat','Võ Thuật'],['vien-tuong','Viễn Tưởng'],['phieu-luu','Phiêu Lưu'],['khoa-hoc','Khoa Học'],['kinh-di','Kinh Dị'],['am-nhac','Âm Nhạc'],['than-thoai','Thần Thoại'],['tai-lieu','Tài Liệu'],['gia-dinh','Gia Đình'],['chinh-kich','Chính Kịch'],['bi-an','Bí Ẩn'],['hoc-duong','Học Đường'],['kinh-dien','Kinh Điển']].map(([slug, name]) => ({ slug, name }));

async function genrePage(slug, my) {
  let genres = [];
  try {
    const d = await api('/the-loai');
    genres = Array.isArray(d) ? d : (d && d.data && (d.data.items || d.data)) || (d && d.items) || [];

function parseM3U(t) {
  const out = [];

  for (const raw of String(t).split(/\r?\n/)) {

    if (l.startsWith('#EXTINF')) {
      const g = (l.match(/group-title="([^"]*)"/) || [])[1] || '';

      cur = { name: l.slice(l.lastIndexOf(',') + 1).trim() || 'Kênh', group: g.split(';')[0].trim(), logo };

      if (/^https:\/\//i.test(l)) { cur.url = l; out.push(cur); }

  }

}

  const t = await r.text();
  let list = [];
  if (t.includes('#EXTINF')) list = parseM3U(t);

  srcCache.set(s.url, list);

}

}

  const startAt = resume && resume.srv === s && resume.ep === i ? resume.t : 0;
  player.classList.add('open');
  $('#pTitle').textContent = movie.name;
  $('#pSub').textContent = (e.name ? 'Tập ' + e.name.replace(/^tập\s*/i, '') : '') + (servers.length > 1 ? ' · ' + servers[s].server_name : '');
  $('#bPrev').hidden = i === 0;
  $('#bNext').hidden = i >= servers[s].server_data.length - 1;
  teardown();
  const m3u8 = e.link_m3u8;
  if (m3u8) {
    vid.hidden = false;
    $('#spin').classList.add('on');
    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ maxBufferLength: 40 });
      hls.loadSource(m3u8); hls.attachMedia(vid);
      hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) { $('#spin').classList.remove('on'); toast('Lỗi phát. Thử nguồn khác'); } });
    } else vid.src = m3u8;
    vid.addEventListener('loadedmetadata', () => { if (startAt > 5) vid.currentTime = startAt; }, { once: true });
    vid.play().catch(() => {});
  } else if (e.link_embed) {
    vid.hidden = true;
    iframe = document.createElement('iframe');
    iframe.src = e.link_embed; iframe.allow = 'autoplay; fullscreen; picture-in-picture'; iframe.allowFullscreen = true;
    pwrap.prepend(iframe);
    toast('Nguồn nhúng: không dùng được thanh tua');
  } else toast('Tập này chưa có nguồn phát');
  syncFull();
  syncPlay();
  showUI();
  pwrap.focus();
}
function teardown() {
  if (hls) { hls.destroy(); hls = null; }
  if (iframe) { iframe.remove(); iframe = null; }
  vid.pause(); vid.removeAttribute('src'); vid.load();
}
function startLive(list, i) {
  const ch = list[i];
  if (!ch) return;
  live = { list, idx: i };
  player.classList.add('open', 'islive');
  $('#pTitle').textContent = ch.name;
  $('#pSub').textContent = 'Trực tiếp' + (ch.group ? ' · ' + ch.group : '');
  $('#bPrev').hidden = false; $('#bNext').hidden = false;
  $('#pvT').textContent = 'Kênh trước'; $('#nxT').textContent = 'Kênh sau';
  teardown();
  vid.hidden = false;
  $('#spin').classList.add('on');
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ liveSyncDurationCount: 3 });
    hls.loadSource(ch.url); hls.attachMedia(vid);
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) { $('#spin').classList.remove('on'); toast('Kênh này không phát được. Thử kênh khác'); } });
  } else vid.src = ch.url;
  vid.play().catch(() => {});
  syncFull(); syncPlay(); showUI();
  pwrap.focus();
}
function closePlayer() {
  savePos();
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  teardown();
  if (document.pictureInPictureElement) document.exitPictureInPicture().catch(() => {});
  player.classList.remove('open');
  if (live) {
    const f = liveFocus; live = null; player.classList.remove('islive');
    if (f && document.contains(f)) f.focus();
    return;
  }
  if (detail.classList.contains('open')) {
    $('#dPlay') && ($('#dPlay').textContent = 'Xem tiếp');
    $('#dPlay') && $('#dPlay').focus();
  }
}
function syncPlay() { $('#bPlay').innerHTML = vid.paused ? ICON_PLAY : ICON_PAUSE; }
function toggle() { vid.paused ? vid.play().catch(() => {}) : vid.pause(); }
function skip(d) {
  if (live || !vid.duration) return;
  vid.currentTime = Math.min(vid.duration, Math.max(0, vid.currentTime + d));
  toast((d > 0 ? '+' : '−') + Math.abs(d) + ' giây');
  showUI();
}
function toggleFull() {
  if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); return; }
  const el = player.requestFullscreen ? player : (player.webkitRequestFullscreen ? player : null);
  if (!el) { toast('Trình duyệt không hỗ trợ toàn màn hình'); return; }
  (el.requestFullscreen || el.webkitRequestFullscreen).call(el).catch(() => toast('Không bật được toàn màn hình'));
}
function syncFull() { $('#zLbl').textContent = document.fullscreenElement ? 'Thoát toàn màn hình' : 'Toàn màn hình'; }
document.addEventListener('fullscreenchange', syncFull);
function paintSeek() {
  const d = vid.duration || 0, t = vid.currentTime || 0, p = d ? t / d * 100 : 0;
  $('#sCur').style.width = p + '%'; $('#sKnob').style.left = p + '%';
  $('#tCur').textContent = fmt(t); $('#tDur').textContent = fmt(d);
  if (d && vid.buffered.length) {
    let end = 0;
    for (let i = 0; i < vid.buffered.length; i++) if (vid.buffered.start(i) <= t) end = Math.max(end, vid.buffered.end(i));
    $('#sBuf').style.width = (end / d * 100) + '%';
  }
}
vid.addEventListener('timeupdate', paintSeek);
vid.addEventListener('progress', paintSeek);
vid.addEventListener('durationchange', paintSeek);
vid.addEventListener('play', () => { syncPlay(); showUI(); });
vid.addEventListener('pause', () => { syncPlay(); showUI(); });
vid.addEventListener('waiting', () => $('#spin').classList.add('on'));
['playing', 'canplay'].forEach(ev => vid.addEventListener(ev, () => $('#spin').classList.remove('on')));
vid.addEventListener('ended', () => {
  if (live) return;
  const n = servers[srv].server_data.length;
  if (epIdx < n - 1) startEp(srv, epIdx + 1);
  else { const pos = getPos(); delete pos[movie.slug]; LS.set(ukey('pos'), pos); closePlayer(); }
});
setInterval(() => { if (player.classList.contains('open') && !vid.paused) savePos(); }, 5000);

$('#seek').addEventListener('click', e => {
  if (live) return;
  const r = e.currentTarget.getBoundingClientRect();
  if (vid.duration) vid.currentTime = (e.clientX - r.left) / r.width * vid.duration;
  showUI();
});
$('#bPlay').onclick = toggle;
$('#bBack10').onclick = () => skip(-10);
$('#bFwd10').onclick = () => skip(10);
$('#bBack').onclick = closePlayer;
$('#bPrev').onclick = () => live ? startLive(live.list, (live.idx - 1 + live.list.length) % live.list.length) : startEp(srv, epIdx - 1);
$('#bNext').onclick = () => live ? startLive(live.list, (live.idx + 1) % live.list.length) : startEp(srv, epIdx + 1);
$('#bZoom').onclick = toggleFull;
$('#bPip').onclick = async () => {
  try {
    if (document.pictureInPictureElement) await document.exitPictureInPicture();
    else if (document.pictureInPictureEnabled) await vid.requestPictureInPicture();
    else toast('Trình duyệt không hỗ trợ PiP');
  } catch (e) { toast('Không bật được PiP'); }
};
pwrap.addEventListener('mousemove', showUI);
pwrap.addEventListener('click', e => { if (e.target === pwrap || e.target === vid) { ui.classList.contains('hide') ? showUI() : toggle(); } });
pwrap.addEventListener('dblclick', e => { if (e.target === vid) toggleFull(); });

/* ---------- Điều hướng bằng phím (remote TV) ---------- */
function scope() {
  if (player.classList.contains('open')) return player;
  if (detail.classList.contains('open')) return detail;
  return document.body;
}
function focusables(sc) {
  return $$('.f', sc).filter(el => {
    if (el.hidden || el.disabled) return false;
    if (sc === document.body && (el.closest('.layer'))) return false;
    const r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  });
}
function focusFirst(root) { const el = $('.card.f, .btn.f, .chip.f', root); el && el.focus({ preventScroll: true }); }
let kbNav = false;
function nearest(dir) {
  const cur = document.activeElement;
  const sc = scope();
  const all = focusables(sc);
  if (!cur || !all.includes(cur)) { all[0] && all[0].focus(); return; }
  const curSide = !!cur.closest('#side');
  const a = cur.getBoundingClientRect();
  const ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bs = Infinity;
  for (const el of all) {
    if (el === cur) continue;
    const inSide = !!el.closest('#side');
    if (!curSide && inSide && dir !== 'left') continue;
    if (curSide && !inSide && dir !== 'right') continue;
    const b = el.getBoundingClientRect();
    const bx = b.left + b.width / 2, by = b.top + b.height / 2;
    const dx = bx - ax, dy = by - ay;
    if ((dir === 'left' || dir === 'right') ? Math.abs(dy) > a.height * 1.2 : Math.abs(dy) > innerHeight * 2) continue;
    let p, q;
    if (dir === 'left') { if (b.right > a.left + 4 && dx >= -2) continue; if (dx >= 0) continue; p = -dx; q = Math.abs(dy); }
    if (dir === 'right') { if (dx <= 0) continue; p = dx; q = Math.abs(dy); }
    if (dir === 'up') { if (dy >= 0) continue; p = -dy; q = Math.abs(dx); }
    if (dir === 'down') { if (dy <= 0) continue; p = dy; q = Math.abs(dx); }
    const score = p + q * (dir === 'left' || dir === 'right' ? 3 : 1.5);
    if (score < bs) { bs = score; best = el; }
  }
  if (best) {
    kbNav = true;
    best.focus({ preventScroll: true });
    best.scrollIntoView({ block: dir === 'up' || dir === 'down' ? 'center' : 'nearest', inline: 'center', behavior: 'auto' });
  }
}
const DIRS = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
document.addEventListener('keydown', e => {
  const k = e.key;
  const typing = document.activeElement && document.activeElement.tagName === 'INPUT';
  if (player.classList.contains('open')) {
    const onBtn = document.activeElement && document.activeElement.classList.contains('cb');
    if (k === 'Escape' || k === 'Backspace' || k === 'BrowserBack') { e.preventDefault(); closePlayer(); return; }
    if (DIRS[k]) {
      e.preventDefault();
      if (onBtn && (k === 'ArrowLeft' || k === 'ArrowRight')) { nearest(DIRS[k]); showUI(); }
      else if (k === 'ArrowLeft') skip(-10);
      else if (k === 'ArrowRight') skip(10);
      else if (k === 'ArrowUp') { showUI(); $('#bPlay').focus(); }
      else if (k === 'ArrowDown') { onBtn ? $('#seek').focus() : $('#bPlay').focus(); showUI(); }
      return;
    }
    if (k === ' ' || k === 'k' || k === 'MediaPlayPause') { e.preventDefault(); toggle(); return; }
    if (k === 'Enter' && !onBtn) { e.preventDefault(); toggle(); return; }
    if (k === 'f' || k === 'z') { toggleFull(); return; }
    if (k === 'p') { $('#bPip').click(); return; }
    if (k === 'n' && !$('#bNext').hidden) { $('#bNext').click(); return; }
    showUI();
    return;
  }
  if (k === 'Escape' || (k === 'Backspace' && !typing) || k === 'BrowserBack') {
    if (detail.classList.contains('open')) { e.preventDefault(); closeDetail(); }
    return;
  }
  if (typing && (k === 'ArrowLeft' || k === 'ArrowRight')) return;
  if (DIRS[k]) { e.preventDefault(); nearest(DIRS[k]); }
});
document.addEventListener('mousemove', () => { /* chuột vẫn dùng bình thường */ });
document.addEventListener('focusin', e => { if (kbNav) { kbNav = false; return; } const c = e.target.closest && e.target.closest('.card'); if (c) c.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'auto' }); });

if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
refreshAvatar();
go('home');
})();
