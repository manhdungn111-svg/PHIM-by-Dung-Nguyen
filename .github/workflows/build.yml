name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Chap nhan giay phep Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setupgradle@v4
        with:
          gradle-version: '8.7'
      - name: Tao du an Android tu cac file web
        run: |
          set -e
          A=android
          rm -rf $A
          mkdir -p $A/app/src/main/java/vn/dungnguyen/phim $A/app/src/main/assets $A/app/src/main/res/mipmap-xhdpi $A/app/src/main/res/drawable
          for f in index.html sw.js manifest.webmanifest logo.png icon-192.png icon-512.png icon-maskable-512.png; do
            [ -f "$f" ] || { echo "THIEU FILE: $f (phai nam o thu muc goc repo)"; exit 1; }
            cp "$f" $A/app/src/main/assets/
          done
          cp icon-192.png $A/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cat > $A/settings.gradle <<'EOF_SETTINGS_GRADLE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "PhimByDungNguyen"
          include ':app'
          EOF_SETTINGS_GRADLE
          cat > $A/build.gradle <<'EOF_BUILD_GRADLE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_BUILD_GRADLE
          cat > $A/gradle.properties <<'EOF_GRADLE_PROPERTIES'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF_GRADLE_PROPERTIES
          cat > $A/app/build.gradle <<'EOF_BUILD_GRADLE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'vn.dungnguyen.phim'
              compileSdk 34

              defaultConfig {
                  applicationId "vn.dungnguyen.phim"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          EOF_BUILD_GRADLE
          cat > $A/app/src/main/AndroidManifest.xml <<'EOF_ANDROIDMANIFEST_XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:banner="@drawable/banner"
                  android:label="Phim by Dung Nguyen"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode"
                      android:screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_ANDROIDMANIFEST_XML
          cat > $A/app/src/main/java/vn/dungnguyen/phim/MainActivity.java <<'EOF_MAINACTIVITY_JAVA'
          package vn.dungnguyen.phim;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;

          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {
              private static final String HOME = "https://appassets.androidplatform.net/assets/index.html";

              private FrameLayout root;
              private WebView web;
              private View customView;
              private WebChromeClient.CustomViewCallback customCallback;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  root = new FrameLayout(this);
                  root.setBackgroundColor(Color.parseColor("#0A0C13"));
                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#0A0C13"));
                  root.addView(web, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(root);

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return loader.shouldInterceptRequest(request.getUrl());
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customCallback = callback;
                          web.setVisibility(View.GONE);
                          root.addView(view, new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          hideSystemBars();
                      }

                      @Override
                      public void onHideCustomView() {
                          if (customView == null) return;
                          root.removeView(customView);
                          customView = null;
                          web.setVisibility(View.VISIBLE);
                          if (customCallback != null) customCallback.onCustomViewHidden();
                          customCallback = null;
                          web.requestFocus();
                      }
                  });

                  if (state != null) web.restoreState(state);
                  else web.loadUrl(HOME);
                  web.requestFocus();
              }

              private void hideSystemBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemBars();
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  if (customView != null) {
                      web.getWebChromeClient().onHideCustomView();
                      return;
                  }
                  web.evaluateJavascript("window.kkBack ? window.kkBack() : false", value -> {
                      if (!"true".equals(value)) finish();
                  });
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              protected void onPause() {
                  web.onPause();
                  super.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }

              @Override
              protected void onDestroy() {
                  root.removeAllViews();
                  web.destroy();
                  super.onDestroy();
              }
          }
          EOF_MAINACTIVITY_JAVA
          python3 - <<'EOF_PY'
          p='android/app/src/main/assets/index.html'
          s=open(p,encoding='utf8').read()
          if 'window.kkBack' not in s:
              a="refreshAvatar();\ngo('home');"
              hook="window.kkBack=()=>{if(player.classList.contains('open')){closePlayer();return true;}if(detail.classList.contains('open')){closeDetail();return true;}if(current!=='home'){go('home');return true;}return false;};\n"
              if a in s:
                  s=s.replace(a,hook+a)
                  open(p,'w',encoding='utf8').write(s)
                  print('da them nut Back')
              else:
                  print('canh bao: khong them duoc nut Back')
          EOF_PY
          pip install -q pillow || true
          python3 - <<'EOF_PY'
          import shutil
          d='android/app/src/main/res/drawable/banner.png'
          try:
              from PIL import Image
              bg=Image.new('RGBA',(320,180),(10,12,19,255))
              lg=Image.open('logo.png').convert('RGBA'); lg.thumbnail((220,120))
              bg.alpha_composite(lg,((320-lg.width)//2,(180-lg.height)//2))
              bg.convert('RGB').save(d)
          except Exception as e:
              print('banner fallback',e); shutil.copy('logo.png',d)
          EOF_PY
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Luu file APK
        uses: actions/upload-artifact@v4
        with:
          name: Phim-by-Dung-Nguyen-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
